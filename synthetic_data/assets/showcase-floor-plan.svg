<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic PIKOM showcase floor plan</title>
  <desc id="desc">Demo convention floor with a main stage, workshop area, and exhibitor booths.</desc>
  <rect width="1200" height="720" rx="28" fill="#eef4f7"/>
  <rect x="55" y="55" width="1090" height="610" rx="22" fill="#fff" stroke="#9db5c2" stroke-width="5"/>
  <text x="90" y="112" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#173042">PIKOM SYNTHETIC SHOWCASE · HALL A</text>
  <rect x="90" y="160" width="360" height="180" rx="16" fill="#d9edf7" stroke="#146c94" stroke-width="4"/>
  <text x="270" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#173042">MAIN STAGE</text>
  <text x="270" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#405b6a">Keynotes · Sessions</text>
  <rect x="485" y="160" width="270" height="180" rx="16" fill="#fdf0d5" stroke="#db9b24" stroke-width="4"/>
  <text x="620" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#553c0d">WORKSHOPS</text>
  <text x="620" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b5528">Rooms 1–3</text>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
    <rect x="90" y="395" width="190" height="100" rx="12" fill="#dcefe4" stroke="#42815b" stroke-width="3"/><text x="185" y="455" font-size="23" fill="#214b31">A01 · NORTHSTAR</text>
    <rect x="305" y="395" width="190" height="100" rx="12" fill="#e4e1f5" stroke="#7163a5" stroke-width="3"/><text x="400" y="455" font-size="23" fill="#38315d">A02 · MERIDIAN</text>
    <rect x="520" y="395" width="190" height="100" rx="12" fill="#d9edf7" stroke="#146c94" stroke-width="3"/><text x="615" y="455" font-size="23" fill="#173042">B01 · CLOUDLINE</text>
    <rect x="735" y="395" width="190" height="100" rx="12" fill="#f7e0e1" stroke="#b6545c" stroke-width="3"/><text x="830" y="455" font-size="23" fill="#65343a">B02 · PIXELWORKS</text>
    <rect x="950" y="395" width="160" height="100" rx="12" fill="#fdf0d5" stroke="#db9b24" stroke-width="3"/><text x="1030" y="455" font-size="21" fill="#553c0d">C01 · FUTURESKILLS</text>
  </g>
  <path d="M120 570h960" stroke="#bfd0d8" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#58717e">Registration · Networking · Exhibitor booths</text>
</svg>
