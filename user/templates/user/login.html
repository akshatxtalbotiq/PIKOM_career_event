{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#f1ece1">
  <link rel="apple-touch-icon" sizes="76x76" href="{% static 'user/img/apple-icon.png' %}">
  <link rel="icon" type="image/png" href="{% static 'user/img/favicon.png' %}">
  <title>
    Sign in | PIKOM
  </title>

  <!-- Fonts: same families as the candidate side -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Bootstrap base, then the PIKOM admin theme -->
  <link id="pagestyle" href="{% static 'user/css/material-dashboard.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'register/css/pikom-admin.css' %}" />

  <style>
    /* Sign-in page layout (standalone, no sidebar) */
    body.login-page {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(179, 64, 31, 0.10), transparent 60%),
        var(--bg-cream);
      color: var(--ink);
      font-family: var(--font-body);
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 1rem 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: var(--surface-cream);
      border: 1px solid var(--border-cream);
      border-radius: var(--radius-xl, 28px);
      box-shadow: 0 18px 48px rgba(28, 25, 19, 0.10);
      padding: 2rem 1.75rem 1.75rem;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .login-brand img {
      height: 44px;
      width: auto;
    }

    .login-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brick-red);
      margin: 0;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 2.4rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin: 0;
      text-align: center;
    }

    .login-sub {
      color: var(--ink-muted);
      font-size: 0.92rem;
      text-align: center;
      margin: 0.35rem 0 0;
    }

    .login-card .form-label {
      font-weight: 600;
      font-size: 0.86rem;
      margin-bottom: 0.35rem;
    }

    .login-card .form-control {
      font-size: 1rem;
      padding: 0.7rem 0.9rem !important;
    }

    .login-card .field + .field {
      margin-top: 1rem;
    }

    .login-card .btn-login {
      width: 100%;
      min-height: 48px;
      margin-top: 1.4rem;
      font-size: 0.85rem;
    }

    .login-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .login-row .form-check {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .login-row .form-check-label {
      font-size: 0.88rem;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .login-forgot {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--brick-red);
    }

    .login-forgot:hover {
      color: var(--brick-red-hover);
    }

    .login-alert {
      margin-top: 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }

    .login-alert h5 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
    }

    .login-alert ul {
      padding-left: 1.1rem;
      margin: 0;
    }

    .login-footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-subtle);
      padding: 1.5rem 0 0.5rem;
    }

    .login-footer a {
      color: var(--ink-muted);
      font-weight: 700;
    }

    .login-footer a:hover {
      color: var(--brick-red);
    }
  </style>
</head>

<body class="login-page">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="signin-title">
      <div class="login-brand">
        <img src="{% static 'register/images/PIKOM.png' %}" alt="PIKOM">
        <div>
          <p class="login-eyebrow text-center">Admin console</p>
          <h1 class="login-title" id="signin-title">Sign in</h1>
          <p class="login-sub">Manage events, registration forms and surveys.</p>
        </div>
      </div>

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="field">
          <label for="login-username" class="form-label">Username</label>
          <input id="login-username" name="username" type="text" class="form-control" placeholder="Enter your username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="login-password" class="form-label">Password</label>
          <input id="login-password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <div class="login-row">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" checked>
            <label class="form-check-label" for="remember_me">Remember me</label>
          </div>
          <a href="{% url 'password_reset' %}" class="login-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-login">Sign in</button>

        {% if messages %}
          <div class="alert alert-danger alert-dismissible fade show login-alert" role="alert">
            <h5>Sign-in failed</h5>
            <ul>
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endif %}
      </form>
    </section>

    <footer class="login-footer">
      &copy; <script>document.write(new Date().getFullYear())</script>
      &middot; Powered by <a href="https://talbotiq.com" target="_blank" rel="noopener">Talbotiq Technologies</a>
    </footer>
  </main>

  <!--   Core JS Files   -->
  <script src="{% static 'user/js/core/popper.min.js' %}"></script>
  <script src="{% static 'user/js/core/bootstrap.min.js' %}"></script>
</body>

</html>
