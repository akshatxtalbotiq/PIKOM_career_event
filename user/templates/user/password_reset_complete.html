{% extends 'user/auth_base.html' %}
{% block title %}Password updated{% endblock %}
{% block panel %}
  <div class="mb-7 text-center">
    <span class="pk-micro mb-3"><b>[04]</b> Done</span>
    <h1 class="pk-display text-[2.25rem]">Password updated</h1>
    <p class="mx-auto mt-2 max-w-[22rem] text-[0.9375rem] text-muted-foreground">Your new password is saved. Sign in with it to continue.</p>
  </div>
  <div class="pk-auth-card p-6 sm:p-7">
    <a href="{% url 'login' %}" class="btn w-full" data-size="lg">Sign in</a>
  </div>
{% endblock %}
