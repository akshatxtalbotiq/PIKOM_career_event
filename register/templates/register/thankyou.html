{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You for Registering</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <link rel="stylesheet" href="{% static 'register/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'register/css/style.css' %}">
    <script src="{% static 'register/js/jquery-3.7.1.min.js' %}"></script>
    <style>
        body {
            background: #e6f2e6;
            /* font-family: 'Segoe UI', sans-serif; */
        }
        .thank-you-card {
            max-width: 700px;
            margin: auto;
            padding: 2.5rem;
            border-radius: 1rem;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .golf-image {
            max-width: 150px;
            margin-bottom: 1rem;
        }
        .reg-number {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1e7e34;
        }
        .btn-home {
            margin-top: 2rem;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="thank-you-card text-center">
        <img src="{% static 'register/images/golf.png' %}" alt="Golf Icon" class="golf-image">
        <h1 class="text-success">You're Officially Registered!</h1>
        <p class="lead">Thank you for signing up with us. We look forward to seeing you on the green!</p>
        <p class="mt-4">Your unique registration number is:</p>
        <p class="reg-number">{{ reg_no }}</p>
        <p class="text-muted mt-3">Please keep this number for your records or present it at check-in on the event day.</p>

        <!-- <a href="/" class="btn btn-success btn-home">Return to Home</a> -->
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
</body>
</html>
