{% extends 'register/base.html' %}
{% load static %}

{% block content %}
 <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
   
    <div class="container-fluid py-2">
      <div class="row">
        <div class="col-12">
          <div class="ms-3">
            <h3 class="mb-0 h4 font-weight-bolder opacity-7"><i class="ti ti-list"></i>
            {{campaign.title}}</h3>
        
            <nav aria-label="breadcrumb m-0">
              <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
                <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="javascript:;">Campaigns</a></li>
                <li class="breadcrumb-item text-sm text-dark active" aria-current="page">{{campaign.title}}</li>
              </ol>
            </nav>
          </div>
        </div>

        <div class="col-12">
          <div class="card my-4">

            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-3">
                <table id="entries" class="table table-hover align-items-center mb-0" style="font-size: 12px;">
                  <thead>
                    <tr>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Reg. No.</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Name</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Email</th>
                        <!-- <th class="text-uppercase text-secondary text-sm font-weight-bolder">Phone</th> -->
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Designation</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder ">Organization</th>                        
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Registartion Date</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Checked-In</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder">Remarks</th>
                        <th class="text-uppercase text-secondary text-sm font-weight-bolder"></th>
                    </tr>
                  </thead>
                  <tbody id="registration-body">
                    <!-- Filled via JavaScript -->
                </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- modal for remarks -->
  <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-sm" style="max-width: 500px;">
    <div class="modal-content border shadow-sm rounded-3">

      <div class="modal-header bg-light border-bottom rounded-top">
        <h5 class="modal-title" id="noteModalLabel">Edit Remarks</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <label for="modal-remarks" class="form-label fw-semibold">Remarks</label>
        <textarea id="modal-remarks" class="form-control border rounded-2 shadow-sm p-2" rows="4" placeholder="Enter remarks..."></textarea>

        <input type="hidden" id="modal-regno">
      </div>

      <div class="modal-footer rounded-bottom">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
          <i class="material-symbols-rounded align-middle">close</i> Close
        </button>
        <button type="button" class="btn btn-primary btn-sm" id="save-remarks-btn">
          <i class="material-symbols-rounded align-middle">save</i> Save
        </button>
      </div>

    </div>
  </div>
</div>



  <script>
    function getCSRFToken() {
          let name = 'csrftoken';
          let cookieValue = null;
          if (document.cookie && document.cookie !== '') {
              let cookies = document.cookie.split(';');
              for (let i = 0; i < cookies.length; i++) {
                  let cookie = cookies[i].trim();
                  if (cookie.substring(0, name.length + 1) === (name + '=')) {
                      cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                      break;
                  }
              }
          }
          return cookieValue;
      }

    $(document).on('click', '.note-btn', function () {
      const regno = $(this).data('regno');
      const remarks = $(this).data('remarks');
      $('#modal-regno').val(regno);
      $('#modal-remarks').val(remarks);
      $('#noteModal').modal('show');
    });

    $('#save-remarks-btn').on('click', function () {
      const regno = $('#modal-regno').val();
      const remarks = $('#modal-remarks').val();

      $.ajax({
        url: '/update_remarks',
        type: 'POST',
        data: {
          reg_no: regno,
          remarks: remarks,
          csrfmiddlewaretoken: getCSRFToken()
        },
        success: function (response) {
          if (response.status === 'success') {
            $('#noteModal').modal('hide');
            $('#entries').DataTable().ajax.reload(null, false); // reload only current page
          } else {
            alert('Failed to update remarks: ' + response.message);
          }
        },
        error: function () {
          alert('An error occurred while updating remarks.');
        }
      });
    });
    
    $(document).ready(function () {

      let campaignId = '{{campaign.campaign_code}}';  

    new DataTable('#entries', {
      responsive: false,
      paging: true,
      processing: true,
      lengthChange: true,
      searching: true,
      pageLength: 10,
      colReorder: true,
      ajax: {
          url: '/get_submission_list',
          type: 'POST', 
          data: function (d) {
              d.id = campaignId;  
          },
          headers: {
              'X-CSRFToken': getCSRFToken()  
          },
          dataSrc: ''
      },
      columns: [
        { data: 'reg_no' },
        { data: 'name' },
        { data: 'email' },
      //   { data: 'phone' },
        { data: 'job_title' },
        { data: 'organization' },         
        { data: 'registration_date' },
        {
          data: 'is_checked_in',
          render: function (data, type, row) {           
            return `<span class="material-symbols-rounded ${data === true ? 'text-success' : 'text-danger'}">${data === true ? 'check_circle' : 'cancel'}</span>`;
          }
        },
        { data: 'remarks' },
        {
          data: null,
          render: function (data, type, row) {
            return `
              <button class="note-btn border-0 bg-transparent p-0" 
                      style="font-size: 24px; color: #0d6efd;"
                      data-regno="${row.reg_no}" 
                      data-remarks="${row.remarks || ''}">
                <i class="material-symbols-rounded">note</i>
              </button>`;
          },
          orderable: false,
          searchable: false
        }
      ],
      dom:
        "<'row mb-3'<'col-sm-6 text-start px-2'f><'col-sm-6 text-end px-2'B>>" +
        "<'row'<'col-12'tr>>" +
        "<'row'<'col-sm-6'i><'col-sm-6'p>>",
      buttons: [
        {
          extend: 'excel',
          className: 'btn btn-outline-success btn-sm', 
          text: '<i class="material-symbols-rounded">download</i> Export to Excel',           
          filename: 'submission_list',
          title: 'Submission List', 
        },
        {
          text: 'Send QR',
          className: 'btn btn-outline-success btn-sm', 
          action: function (e, dt, node, config) {
              $.ajax({
                  url: "/send_qr/" + campaignId,
                  cache: false,
                  success: function(response) {
                  }, error: commonAjaxErrorCallBack
              });
          }
        }
      ],
      fixedHeader: {
        header: true,
        footer: true,
        headerOffset: 50
      },
      autoWidth: true,
      scrollCollapse: true,
      language: {
        paginate: {
          previous: '<i class="material-symbols-rounded">chevron_left</i>',
          next: '<i class="material-symbols-rounded">chevron_right</i>'
        },
        searchBuilder: {
          button: 'Add filters',
          add: '<i class="material-symbols-rounded">add</i>Add filters',
          title: {
            0: 'Filters',
            _: 'Filters (%d)'
          },
          delete: '<i class="material-symbols-rounded">delete</i>',
          right: '<i class="material-symbols-rounded">chevron_right</i>',
          left: '<i class="material-symbols-rounded">chevron_left</i>',
          clearAll: '<i class="material-symbols-rounded">x</i>Clear All'
        },
        emptyTable:
          "<img src='{% static 'user/img/illustrations/notfoundImg3.png' %}' width='180px' alt='No data' /><p class='fs-5 fw-500'>No Record available in table</p>",
        infoEmpty: "0 Record",
        zeroRecords:
          "<img src='{% static 'user/img/illustrations/notfoundImg3.png' %}' width='180px' alt='No data' /><p class='fs-5 fw-500'>No Record to display</p>"
      },
      order: [[0, 'desc']],
      initComplete: function () {
        console.log('DataTable initialized and loaded via AJAX');
      }
    });
  });

  
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
    function commonAjaxErrorCallBack(jqXHR, ajaxOptions, thrownError) {
    if (jqXHR.responseJSON?.error_message || jqXHR.responseJSON?.message) {
        let message = jqXHR.responseJSON.error_message || jqXHR.responseJSON.message
        let errorTitle = jqXHR.responseJSON.error_title || "Contact Support"
        //AlertButton("Error", message);
        Swal.fire({
            title: errorTitle,
            text: message,
            icon: "error",
            confirmButtonColor: "#DD6B55",
            confirmButtonText: "OK"
        });

    } else {
        AlertButton("Error", `Something went wrong ${jqXHR.status}, ${thrownError}, Please contact Admin`);
    }
}
  </script>
{%endblock %}
