<!doctype html>
<html>
   <head>
      <meta charset="utf-8" />
      <title>Label</title>
      <style>
         @page {
            size: 70mm 50mm;
            margin: 0;
         }
         html,
         body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #000;
         }
         /* 70x50mm badge: name is the hero, organisation sits under a short rule. */
         .label {
            width: 70mm;
            height: 50mm;
            box-sizing: border-box;
            padding: 4mm 4.5mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            page-break-after: always;
         }
         .label:last-child {
            page-break-after: auto;
         }
         .event {
            font-size: 7pt;
            letter-spacing: 0.06em;
            margin-bottom: 2mm;
         }
         .name {
            width: 100%;
            font-size: 20pt;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.01em;
            overflow-wrap: normal;
            word-break: normal;
            max-height: 2.2em;
         }
         .org {
            width: 100%;
            font-size: 11pt;
            font-weight: 500;
            line-height: 1.2;
            overflow-wrap: anywhere;
         }
         .org:not(:empty)::before {
            content: "";
            display: block;
            width: 10mm;
            height: 0.5mm;
            background: #000;
            margin: 2.5mm auto 2.5mm;
         }
      </style>
   </head>
   <body>
      <div class="label">
         <!-- <div class="event">{{ event }}</div> -->
         <div class="name">{{ name }}</div>
         <div class="org">{{ org }}</div>
      </div>
      <script>
         window.onload = function () {
            // Shrink the name until no word overflows and it fits on two lines.
            document.querySelectorAll(".name").forEach(function (el) {
               var s = 20;
               el.style.fontSize = s + "pt";
               while ((el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight + 1) && s > 9) {
                  s -= 0.5;
                  el.style.fontSize = s + "pt";
               }
            });
            try {
               window.focus();
               window.print();
            } catch (e) {}
         };
      </script>
   </body>
</html>
