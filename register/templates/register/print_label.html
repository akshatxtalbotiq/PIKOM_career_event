<!doctype html>
<html>
   <head>
      <meta charset="utf-8" />
      <title>Label</title>
      <style>
         @page {
            size: 70mm 50mm;
            margin: 0;
         }
         html,
         body {
            margin: 0;
            padding: 0;
         }
         * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
         }
         body {
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
         }
         .label {
            width: 70mm;
            height: 50mm;
            box-sizing: border-box;
            padding: 3mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            page-break-after: always;
         }
         .label:last-child {
            page-break-after: auto;
         }
         .event {
            font-size: 8pt;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2mm;
         }
         .name {
            font-size: 18pt;
            font-weight: 700;
            line-height: 1.00;
            word-break: break-word;
         }
         .org {
            font-size: 14pt;
            margin-top: 2mm;
            word-break: break-word;
         }
      </style>
   </head>
   <body>
      <div class="label">
         <!-- <div class="event">{{ event }}</div> -->
         <div class="name">{{ name }}</div>
         <div class="org">{{ org }}</div>
      </div>
      <script>
         window.onload = function () {
            document.querySelectorAll(".name").forEach(function (el) {
               var s = 20;
               el.style.fontSize = s + "pt";
               while (el.scrollWidth > el.clientWidth && s > 9) {
                  s -= 0.5;
                  el.style.fontSize = s + "pt";
               }
            });
            try {
               window.focus();
               window.print();
            } catch (e) {}
         };
      </script>
   </body>
</html>
