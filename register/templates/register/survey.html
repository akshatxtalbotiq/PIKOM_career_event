{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ survey.title }}</title>
  <link rel="stylesheet" href="{% static 'register/assets/css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'register/assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'register/sweetalert2/sweetalert2.css' %}">
  <style>
    .border-left-custom { border-left: 6px solid #198754; padding-left: .5rem; }

  </style>
</head>
<body>
  <div class="container-xl py-5">

    <div class="row mb-4">
      <div class="col-12 p-0 overflow-hidden rounded mb-4 shadow-lg">
        <img src="{% static 'register/assets/images/banner.png' %}" class="img-fluid w-100 rounded" alt="">
      </div>

      <div class="col-12 mb-2">
        <div class="p-4 rounded shadow bg-light" role="alert">
         {{ survey.description|safe }}
        </div>
      </div>
    </div>

    <div class="card p-4 shadow rounded mt-2">
    <form action="{% url 'survey_initial_submit' survey.id %}" method="post">
      {% csrf_token %}

      <div class="row mb-3">
          <div class="col-md-6">
            <label for="name1" class="form-label"><span class="text-danger">*</span>Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Name" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label"><span class="text-danger">*</span>Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="myname@pikom.com" required>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label for="phone" class="form-label"><span class="text-danger">*</span>Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+6012-3456789" required>
          </div>
          <div class="col-md-6">
            <label for="organization" class="form-label">Organization/Company</label>
            <input type="text" class="form-control" id="organization" name="organization" placeholder="Organization Name">
          </div>
        </div>

        <div class="text-center mt-4">
            <br />
            <button type="submit" class="btn btn-success px-4">Proceed to Survey</button>
        </div>   
    </form>
    </div>

    <div class="text-center mt-4" style="font-size:.78rem; color:#9aa3ad; letter-spacing:.02em;">
      Powered by <span style="font-weight:600; color:#8a93a0;">Talbotiq Technologies</span>
    </div>
  </div>

  <script src="{% static 'register/assets/libraries/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'register/sweetalert2/sweetalert2.js' %}"></script>
  <script>
   
</script>

</body>
</html>
