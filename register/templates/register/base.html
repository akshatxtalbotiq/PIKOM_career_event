<!DOCTYPE html>

<head>

  <link rel="icon" type="image/png" href="{% static 'user/img/favicon.png' %}">
  <title>
    PIKOM
  </title>
  <!-- Main Jquery -->
  <script src="{% static 'user/js/core/jquery-3.7.1.min.js' %}"></script>
  <!--     Fonts and icons     -->
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css" />
  <link href="{% static 'user/css/nucleo-icons.css' %}" rel="stylesheet" />
  <link href="{% static 'user/css/nucleo-svg.css' %}" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />


  <!-- CSS Files -->
  <link id="pagestyle" rel="stylesheet" href="{% static 'user/css/material-dashboard.css' %}" />
  <link id="datatableStyle" rel="stylesheet" href="{% static 'user/css/datatables.min.css' %}">
  <link id="datatableStyle" rel="stylesheet" href="{% static 'user/js/plugins/timepicker/flatpickr.min.css' %}">

  <style>
    .icon-btn {
      background: none;
      border: none;
      padding: 0.25rem;
      cursor: pointer;
    }

    .icon-btn i {
      font-size: 1.5rem; /* Adjust size as needed */
      color: #6c757d; /* Optional: match your theme */
    }

    .icon-btn:hover i {
      color: #000; /* Optional: hover effect */
    }

  </style>
</head>

<body class="g-sidenav-show  bg-gray-100">

    <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-lg fixed-start ms-2  bg-white my-2" id="sidenav-main">         
    <div class="sidenav-header">         
        <i class="fas fa-times p-3 cursor-pointer text-dark opacity-5 position-absolute end-0 top-0 d-none d-xl-none"             
           aria-hidden="true" id="iconSidenav"></i>         
        <a class="navbar-brand px-4 py-3 m-0" href="">             
            <img src="{% static 'user/img/PIKOM.png' %}" class="navbar-brand-img" alt="main_logo">             
            <span class="ms-1 text-sm text-dark visually-hidden">PIKOM</span>         
        </a>         
    </div>         
    <hr class="horizontal dark mt-0 mb-2">         
    
    <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">         
        <ul class="navbar-nav">             
            <!-- <li class="nav-item">             
                <a class="nav-link" href="dashboard.html">                 
                    <i class="material-symbols-rounded opacity-5">dashboard</i>                 
                    <span class="nav-link-text ms-1">Dashboard</span>             
                </a>             
            </li> -->             
            <li class="nav-item">             
                <a class="nav-link active" href="{% url 'campaign_list' %}">                 
                    <i class="material-symbols-rounded opacity-5">table_view</i>                 
                    <span class="nav-link-text ms-1">Campaigns</span>             
                </a>             
            </li>             
            <!-- <li class="nav-item">             
                <a class="nav-link" href="campaigns.html">                 
                    <i class="material-symbols-rounded opacity-5">person</i>                 
                    <span class="nav-link-text ms-1">Users</span>             
                </a>             
            </li> -->         
        </ul>
        
        <!-- Logout Button -->
        <div class="mt-4">
            <hr class="horizontal dark mt-0 mb-2">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="{% url 'logout' %}">
                        <i class="material-symbols-rounded opacity-5">logout</i>
                        <span class="nav-link-text ms-1">Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>      
</aside>
    {% block content %}
    {% endblock %}  
    

  <!--   Core JS Files   -->
  <script src="{% static 'user/js/core/popper.min.js' %}"></script>
  <script src="{% static 'user/js/core/bootstrap.min.js' %}"></script>
  <script src="{% static 'user/js/plugins/perfect-scrollbar.min.js' %}"></script>
  <script src="{% static 'user/js/plugins/smooth-scrollbar.min.js' %}"></script>
  <script async defer src="{% static 'user/js/buttons.js' %}"></script>
  <script src="{% static 'user/js/material-dashboard.js' %}"></script>

  <script src="{% static 'user/js/plugins/datatables.min.js' %}"></script>
  <script src="{% static 'user/js/plugins/timepicker/flatpickr.js' %}"></script>
  
  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>

</html>
