  <style>
    /* Confirmation page — Savi-like: white page, soft grey panel, event --theme drives the accent. */
    :root { --navy: #0A2154; --ink: #0A2154; --muted: #5B6683; --line: #E3E8F2; --panel: #F5F7FB; }
