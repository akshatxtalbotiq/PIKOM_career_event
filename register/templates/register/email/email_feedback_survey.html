{% load static %}
<!DOCTYPE html>
<html><body style="font-family: Arial, sans-serif; color:#222; line-height:1.45;">
  <table cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;">
    <tr><td style="padding:20px 0;text-align:center;">
      <h2 style="margin:0 0 8px;">Your feedback matters</h2>
    </td></tr>
    <tr><td style="padding:0 24px;">
      <p>Hi {{ name|default:"there" }},</p>
      <p>Thank you for attending <strong>{{ campaign.title|default:registration_survey.title }}</strong>.</p>
      <p>We'd love your feedback. The survey takes only a few minutes:</p>
      <p style="text-align:center;margin:24px 0;">
        <a href="{{ survey_url }}" style="background:#198754;color:#fff;text-decoration:none;padding:12px 24px;border-radius:6px;display:inline-block;">
          Open the survey
        </a>
      </p>
      <p style="font-size:12px;color:#666;">Or paste this link in your browser:<br>{{ survey_url }}</p>
    </td></tr>
  </table>
</body></html>
