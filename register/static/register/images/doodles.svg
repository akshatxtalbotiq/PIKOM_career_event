<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Faint, hand-drawn event doodles tiled behind the console. Strokes only; opacity is set here so the CSS stays simple. -->
  <g fill="none" stroke="#1A5FB4" stroke-opacity=".06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ticket -->
    <g transform="translate(28 34) rotate(-12)">
      <path d="M0 6a6 6 0 0 1 6-6h58a6 6 0 0 1 6 6v8a7 7 0 0 0 0 14v8a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6v-8a7 7 0 0 0 0-14z"/>
      <path d="M48 4v34" stroke-dasharray="3 5"/>
      <path d="M12 15h24M12 25h16"/>
    </g>
    <!-- calendar -->
    <g transform="translate(176 22) rotate(6)">
      <rect x="0" y="6" width="50" height="46" rx="8"/>
      <path d="M0 20h50M14 0v12M36 0v12"/>
      <path d="M12 32h6M24 32h6M36 32h4M12 42h6M24 42h6"/>
    </g>
    <!-- QR code -->
    <g transform="translate(318 40) rotate(-6)">
      <rect x="0" y="0" width="16" height="16" rx="3"/>
      <rect x="32" y="0" width="16" height="16" rx="3"/>
      <rect x="0" y="32" width="16" height="16" rx="3"/>
      <path d="M32 32h6v6M44 32v4M32 44h4M42 42h6v6"/>
    </g>
    <!-- golf flag + ball -->
    <g transform="translate(70 148) rotate(4)">
      <path d="M8 62V0l30 10L8 22"/>
      <path d="M-10 64c10-6 34-6 46 0"/>
      <circle cx="52" cy="58" r="7"/>
      <path d="M49 56h.01M54 55h.01M52 60h.01"/>
    </g>
    <!-- megaphone -->
    <g transform="translate(222 140) rotate(-10)">
      <path d="M0 14h10l30-14v44L10 30H0z"/>
      <path d="M10 30l5 16h8l-4-14"/>
      <path d="M48 10c5 4 5 20 0 24M55 4c9 7 9 29 0 36"/>
    </g>
    <!-- sparkle -->
    <g transform="translate(362 170)">
      <path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12z"/>
    </g>
    <!-- clipboard with ticks -->
    <g transform="translate(20 278) rotate(8)">
      <rect x="0" y="6" width="44" height="56" rx="7"/>
      <rect x="12" y="0" width="20" height="12" rx="4"/>
      <path d="M9 28l4 4 7-8M26 29h10M9 46l4 4 7-8M26 47h10"/>
    </g>
    <!-- envelope -->
    <g transform="translate(146 300) rotate(-8)">
      <rect x="0" y="0" width="58" height="40" rx="7"/>
      <path d="M3 4l26 20L55 4"/>
    </g>
    <!-- map pin -->
    <g transform="translate(292 268) rotate(10)">
      <path d="M20 56S0 34 0 20a20 20 0 0 1 40 0c0 14-20 36-20 36z"/>
      <circle cx="20" cy="20" r="7"/>
    </g>
    <!-- star -->
    <g transform="translate(372 352) rotate(-14)">
      <path d="M14 0l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z"/>
    </g>
    <!-- small dots and squiggles to break the grid -->
    <circle cx="140" cy="100" r="2.5"/>
    <circle cx="300" cy="120" r="2.5"/>
    <circle cx="110" cy="250" r="2.5"/>
    <circle cx="250" cy="380" r="2.5"/>
    <circle cx="390" cy="250" r="2.5"/>
    <path d="M150 220c6-6 12 6 18 0s12 6 18 0"/>
    <path d="M330 200c6-6 12 6 18 0"/>
    <path d="M60 390c6-6 12 6 18 0s12 6 18 0"/>
  </g>
</svg>
