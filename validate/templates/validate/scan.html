{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{ name }} Registration</title>
    <link rel="stylesheet" href="{% static 'user/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/style.css' %}">

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .swal2-rounded {
            border-radius: 18px !important;
        }

        .swal2-shadow {
            box-shadow: 0 6px 18px rgba(0,0,0,0.15) !important;
        }


        #start-scan-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 1.2rem;
            font-size: 1.25rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #start-scan-btn:hover {
            background-color: #218838;
            transform: scale(1.03);
        }

        #start-scan-btn:active {
            background-color: #1e7e34;
            transform: scale(0.97);
        }

        #reader {
            width: 300px;
            height: 300px;
            aspect-ratio: 1/1;
            margin-inline: auto;
            margin-bottom: 2rem;
            border-radius: .75rem;
            overflow: hidden;
            box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.1);

            > video {
                width: 100%;
                height: 100%;
                object-fit: cover;

            }
        }

    </style>
</head>
<body class="bg-body-tertiary">

<div class="container-xl py-5">
    <input type="hidden" id="flg" value="0"/>
    <div class="row mt-3">
        <div class="col-xl-6 col-lg-12 mx-auto ">
            <h1 class="mb-3 text-center">{{ name }}</h1>

            <div class="d-flex justify-content-center align-items-center mb-3">
                <button id="start-scan-btn">Scan QR Code</button>
            </div>
            <div id="reader" class="ratio ratio-1x1" style=" background-color: aquamarine;display: none"></div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" id="printLabelToggle" checked>
                    <label class="form-check-label" for="printLabelToggle">Print badge label on scan</label>
                </div>
                <button class="btn btn-sm btn-outline-secondary" type="button" id="testPrintBtn">
                    Test print
                </button>
            </div>

            <div class="nb-3">
                <label for="Code" class="form-label">Code</label>
                <input name="code" id="code" class="form-control" placeholder="Code" autofocus/>
            </div>
            <div class="nb-3 mt-4">
                <label for="remark" class="form-label">Remark (Optional)</label>
                <textarea name="remark" id="remark" class="form-control" placeholder="" rows="5" ></textarea>
            </div>
        </div>
    </div>
</div>

<!-- Hidden iframe used to push individual label print jobs to the OS
     printer dialog. The browser's selected printer (configured once on the
     check-in laptop) is what actually receives the print, so a Dymo / Brother
     QL-style label printer set as the default will print without prompting if
     "silent print" is enabled in the browser, otherwise it'll show the dialog
     pre-targeted at that printer. -->
<iframe id="labelPrintFrame" title="Label print frame"
        style="position:fixed; right:0; bottom:0; width:0; height:0; border:0; visibility:hidden;"></iframe>

<script src="{% static 'user/js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'user/js/bootstrap.bundle.min.js' %}"></script>

<script>
    // --- Config ---
    const POST_URL = "/api/attendance/scan/";
    const SCAN_DEBOUNCE_MS = 40;          // buffer tiny keyboard jitter
    const DUP_WINDOW_MS = 800;            // ignore accidental double-scan of same code
    const MAX_RETRIES = 2;                // retry transient network issues

    // --- Helpers ---
    const getCookie = (name) => {
        const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return m ? m.pop() : '';
    };
    const statusEl = document.getElementById("remark");
    const scanInput = document.getElementById("code");
    const focusBack = () => setTimeout(() => scanInput.focus(), 0);
    const show = (msg) => {
        statusEl.innerText = msg;
    };

    // --- Queue state ---
    const q = [];
    let processing = false;
    let lastScan = {val: null, ts: 0};
    let debounceT = null;

    // --- Enqueue & processor ---
    function enqueue(token) {
        const flagElement = document.getElementById("flg");
        if (flagElement.value === "1") return;   // BLOCK new scans

        if (!token) return;
        const now = Date.now();
        if (token === lastScan.val && (now - lastScan.ts) < DUP_WINDOW_MS) return; // drop dup bursts
        lastScan = {val: token, ts: now};
        q.push({token, tries: 0});
        processQueue();
    }

    async function processQueue() {
        if (processing) return;

        if (document.getElementById("flg").value === "1") {
            processing = false;
            return;  // STOP processing queue during alert
        }

        processing = true;
        while (q.length) {
            const job = q[0];
            try {
                await postToken(job.token);
                show(`OK: ${job.token}`);
                q.shift();
            } catch (err) {
                if (shouldRetry(err) && job.tries < MAX_RETRIES) {
                    job.tries += 1;
                    await sleep(300 * job.tries); // simple backoff
                } else {
                    show(`FAILED: ${job.token} — ${err.message || err}`);
                    q.shift(); // drop or, if you prefer, persist to localStorage for later re-sync
                }
            }
            focusBack();
        }
        processing = false;
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    function shouldRetry(err) {
        // Retry network/5xx timeouts; adjust as needed
        const msg = (err && err.message) || "";
        return /timeout|network|5\d\d/.test(msg);
    }

    // async function postToken(decodedText){
    //     const ctrl = new AbortController();
    //     const timeout = setTimeout(() => ctrl.abort(), 8000); // guard long hangs
    //     try {
    //         fetch(`/validate/${decodedText}`)
    //                     .then(res => res.json())
    //                     .then(data => {
    //                         if (data.message)z
    //                             show(data.message);
    //                     })
    //                     .catch(err => {
    //                         show("Error validating QR code.");
    //                         console.error(err);
    //                     });
    //     } finally {
    //         clearTimeout(timeout);
    //     }
    // }

    // Build the HTML for a single badge label.
    // Tuned for 70 x 40 mm thermal label stock (common AIMO size).
    // The printer must be set as the system default with matching media
    // size; for fully-silent printing, launch Chrome with
    //   --kiosk-printing --disable-print-preview
    // and select the AIMO printer as default.
    function buildLabelHtml(data) {
        const name = (data.name || 'Guest').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        const org  = (data.organization || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        return `<!doctype html>
<html><head><meta charset="utf-8"><title>Label</title>
<style>
  /* AIMO label stock: 70mm wide x 40mm tall. The printer driver must be
     configured for the same media size or the label will be cropped or
     scaled. Margin is intentionally small so we use the full label. */
  @page { size: 70mm 40mm; margin: 2mm; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; color: #000; -webkit-print-color-adjust: exact; }
  .label {
    padding: 1mm 2mm;
    box-sizing: border-box;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  /* Name can wrap to 2 lines for longer names; anything beyond is clipped
     so the org line below always stays visible. */
  .name {
    font-size: 16pt; font-weight: 700; line-height: 1.05;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  /* Org wraps freely (no ellipsis); whole label clips if it ever overflows. */
  .org  {
    font-size: 10pt; margin-top: 1.5mm; line-height: 1.15;
    word-break: break-word;
  }
</style></head>
<body>
  <div class="label">
    <div class="name">${name}</div>
    ${org ? `<div class="org">${org}</div>` : ''}
  </div>
  <script>
    window.onload = function () {
      try { window.focus(); window.print(); } catch (e) {}
    };
  <\/script>
</body></html>`;
    }

    function printLabel(data) {
        if (!document.getElementById('printLabelToggle')?.checked) return;
        if (!data || !data.name) return;
        const frame = document.getElementById('labelPrintFrame');
        if (!frame) return;
        const html = buildLabelHtml(data);
        // srcdoc kicks off a fresh document inside the iframe; the inline
        // onload script then triggers the print dialog/silent print.
        frame.srcdoc = html;
    }

    document.getElementById('testPrintBtn')?.addEventListener('click', () => {
        printLabel({ name: 'Sample Delegate', organization: 'Acme Sdn Bhd', reg_no: 'REG000000' });
    });

    async function postToken(decodedText) {

        const flagElement = document.getElementById("flg");
        const flagValue = flagElement.value;

        if (flagValue === "1") {
            // If flag is set to 1, skip processing
            return;
        }
        else
        {
            // Set the flag to 1 to indicate processing is underway
            flagElement.value = "1";
        }

        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 8000); // guard long hangs

        const endpoint = `{{ validate_endpoint|default:'/validate/' }}${decodedText}`;

        try {
            const res = await fetch(endpoint, { signal: ctrl.signal });
            const data = await res.json();

            // Blocked: delegate exists but isn't approved. Show a red alert,
            // don't print a label, don't mark them as checked in.
            if (data && data.typ === 'blocked') {
                await Swal.fire({
                    title: 'Not approved',
                    html: `<div style="text-align:left;">
                            <p><strong>${data.name || 'Delegate'}</strong>${data.reg_no ? ' (' + data.reg_no + ')' : ''} is not approved for this event.</p>
                            <p class="text-muted small mb-0">Status: ${data.status || 'unknown'}</p>
                          </div>`,
                    icon: 'error',
                    confirmButtonText: 'OK',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                });
                flagElement.value = "0";
                processQueue();
                return;
            }

            // Successful check-in: print the label (if toggle is on) before
            // popping the confirmation modal so the print dialog can resolve
            // while the operator reads the screen.
            if (data && (data.typ === 'new' || data.typ === 'exist')) {
                printLabel(data);
            }

            const promptInfo = data && data.prompt_checkin_info === '1';
            const summaryHtml = `
                <div style="font-size: 1.05rem; color:#444; text-align:left; line-height:1.5;">
                    <p style="margin: 16px 0 8px 0;"><strong>Name:</strong><br>${data.name || ''}</p>
                    <p style="margin: 0 0 8px 0;"><strong>Company:</strong><br>${data.organization || ''}</p>
                    ${data.reg_no ? `<p style="margin: 0; color:#666; font-size:.9rem;">Ref: ${data.reg_no}</p>` : ''}
                </div>`;

            if (data && data.message && (promptInfo || data.typ === 'new' || data.typ === 'exist')) {
                await Swal.fire({
                    title: `<span style="font-size: 1.3rem; font-weight: 600; color:#333;">${data.message}</span>`,
                    html: summaryHtml,
                    icon: data.typ === 'new' ? 'success' : 'info',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#3085d6',
                    width: '420px',
                    customClass: { popup: 'swal2-rounded swal2-shadow' },
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                });
                flagElement.value = "0";
                processQueue();
            } else {
                if (data && data.message) show(data.message);
                flagElement.value = "0";
                processQueue();
            }
        } catch (err) {
            await Swal.fire({
                title: 'Error',
                text: "Error validating QR code.",
                icon: 'error',
                confirmButtonText: 'OK',
                allowOutsideClick: false,
                allowEscapeKey: false
            });
            console.error(err);
            flagElement.value = "0";

        } finally {
            clearTimeout(timeout);
        }
    }


    async function postToken1(token) {
        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 8000); // guard long hangs
        try {
            const res = await fetch(POST_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                data: {token},
                signal: ctrl.signal,
            });
            if (!res.ok) {
                const text = await res.text().catch(() => "");
                throw new Error(`${res.status} ${res.statusText} ${text}`);
            }
            return res.json();
        } finally {
            clearTimeout(timeout);
        }
    }

    // --- Capture scans ---
    // Most “keyboard wedge” scanners end with Enter. Prefer keydown Enter over change().
    scanInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            const val = scanInput.value.trim();
            scanInput.value = "";      // clear immediately so next scan won't overlap visually
            enqueue(val);
            focusBack();
        }
    });

    // If your scanner doesn’t send Enter and you rely on change(), keep this fallback:
    scanInput.addEventListener("change", () => {
        clearTimeout(debounceT);
        debounceT = setTimeout(() => {
            const val = scanInput.value.trim();
            scanInput.value = "";
            enqueue(val);
            focusBack();
        }, SCAN_DEBOUNCE_MS);
    });

    // Always keep focus even if user clicks elsewhere
    window.addEventListener("blur", focusBack);
    document.addEventListener("visibilitychange", focusBack);

    // Force focus no matter where user clicks
    document.addEventListener("mousedown", (e) => {
        focusBack();
    }, true);

    document.addEventListener("click", (e) => {
        focusBack();
    }, true);

    document.addEventListener("mousedown", (e) => {
        if (e.target.tagName === "TEXTAREA") {
            e.preventDefault();
            focusBack();
        }
    }, true);







    focusBack();
</script>

</body>
