{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{name}} Registration</title>
  <link rel="stylesheet" href="{% static 'user/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/style.css' %}">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
      #start-scan-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 1.2rem;
      font-size: 1.25rem;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    #start-scan-btn:hover {
      background-color: #218838;
      transform: scale(1.03);
    }

    #start-scan-btn:active {
      background-color: #1e7e34;
      transform: scale(0.97);
    }
    #reader {
      width: 300px;
      height: 300px;
      aspect-ratio: 1/1;
      margin-inline: auto;
      margin-bottom: 2rem;
      border-radius: .75rem;
      overflow: hidden;
      box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.1);
      >video{
        width: 100%;
        height: 100%;
        object-fit: cover;

      }
    }

  </style>
</head>
<body class="bg-body-tertiary">

  <div class="container-xl py-5">
    <div class="row mt-3">
      <div class="col-xl-6 col-lg-12 mx-auto ">
        <h1 class="mb-3 text-center">{{name}}</h1>

          <div class="d-flex justify-content-center align-items-center mb-3">
        <button id="start-scan-btn">Scan QR Code</button>
          </div>
        <div id="reader" class="ratio ratio-1x1" style=" background-color: aquamarine;display: none" ></div>

        <div class="nb-3">
            <label for="Code" class="form-label">Code</label>
            <input name="code" id="code" class="form-control" placeholder="Code" autofocus />
          </div>
        <div class="nb-3">
            <label for="remark" class="form-label">Remark (Optional)</label>
            <textarea name="remark" id="remark" class="form-control" placeholder="" rows="5" disabled></textarea>
          </div>
      </div>
    </div>
  </div>

    <script src="{% static 'user/js/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'user/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        const startScanBtn = document.getElementById("start-scan-btn");
        const reader = document.getElementById("reader");
        const message = document.getElementById("message");
        const result = document.getElementById("remark");
        const html5QrCode = new Html5Qrcode("reader");
        const codeinput = document.getElementById('code');

        let isScanning = false;

        startScanBtn.addEventListener("click", () => {
            result.innerText = "";
            reader.style.display = "block";
            startScanBtn.style.display = "none";
            isScanning = true;

            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: 250
                },
                (decodedText) => {
                    if (!isScanning) return;

                    isScanning = false;
                    html5QrCode.stop().then(() => {
                        reader.style.display = "none";
                        startScanBtn.style.display = "inline-block";

                        $('#code').val(decodedText);
                        validate(decodedText);

                    }).catch(err => {
                        console.error("Failed to stop camera:", err);
                    });
                },
                (errorMsg) => {
                    // Ignore scan failures silently
                }
            ).catch(err => {
                console.error("Unable to start scanning:", err);
                result.innerText = "Camera error. Please try again.";
                reader.style.display = "none";
                startScanBtn.style.display = "inline-block";
            });
        });

        function validate(decodedText){
            fetch(`/validate/${decodedText}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.remarks)
                                    result.innerText = data.message;
                                codeinput.value='';
                                codeinput.focus();
                            })
                            .catch(err => {
                                result.innerText = "Error validating QR code.";
                                console.error(err);
                            });
        }

        codeinput.addEventListener('change', function() {
            console.log('Value committed:', codeinput.value);
            validate(codeinput.value)
        });
    </script>
</body>
</html>
